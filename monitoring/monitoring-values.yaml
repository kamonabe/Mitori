alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfigMatcherStrategy:
      type: None
  config:
    global:
      resolve_timeout: 5m

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

grafana:
  service:
    type: NodePort
    nodePort: 30080
  env:
    GF_SERVER_ROOT_URL: "http://localhost/grafana"
    GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  grafana.ini:
    plugins:
      plugin_admin_enabled: false
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  persistence:
    enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

# admission webhook（PrometheusRule 検証用）を完全に無効化する。
# 証明書生成 Job (admission-create) が環境要因で失敗して tls-secret が作られず、
# operator が `secret "...-admission" not found` で起動できなくなる問題の回避。
# POC / プライベートクラスタでは webhook 無効が定石（Prometheus/Grafana の動作に影響なし）。
# ★ enabled:false と patch.enabled:false だけでは不十分。operator 側が tls-secret を
#    要求し続けるため tls.enabled:false も必須（helm-charts issue #19147 / #1438）。
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false

# k3s ではこれらのコンポーネントが独立 Pod として動かないため
# メトリクス収集・アラートルールを無効化する
kubeProxy:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
