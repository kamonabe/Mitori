apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-scan
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inventory-scan
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- nonResourceURLs: ["/version"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inventory-scan
subjects:
- kind: ServiceAccount
  name: inventory-scan
  namespace: app
roleRef:
  kind: ClusterRole
  name: inventory-scan
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inventory-scan-helm
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  # Helm stores release info in secrets (driver: secrets)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inventory-scan-helm
subjects:
- kind: ServiceAccount
  name: inventory-scan
  namespace: app
roleRef:
  kind: ClusterRole
  name: inventory-scan-helm
  apiGroup: rbac.authorization.k8s.io
