apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Common library
  - name: common-lib
    files:
      - common/db.py
      - common/slack.py
  # MITRE ATT&CK
  - name: mitre-collector-script
    files:
      - mitre/collector.py
  - name: mitre-normalizer-script
    files:
      - mitre/normalizer.py
  # EOL Watch
  - name: eol-watch-script
    files:
      - eol-watch/collector.py
  - name: lifecycle-notify-script
    files:
      - eol-watch/lifecycle_notify.py
  # Mirror Check
  - name: mirror-check-script
    files:
      - mirror-check/check-epel-mirrors.sh
  # Inventory Scan
  - name: inventory-scan-script
    files:
      - inventory-scan/scanner.py
  # CVE Watch
  - name: cve-watch-script
    files:
      - cve-watch/cve_watch.py
  - name: cve-coverage-report-script
    files:
      - cve-watch/cve_coverage_report.py
  # KEV
  - name: kev-collector-script
    files:
      - kev/kev_collector.py
  - name: kev-notify-script
    files:
      - kev/kev_notify.py
  - name: cve-kev-alert-script
    files:
      - kev/cve_kev_alert.py
  # EPSS
  - name: epss-enricher-script
    files:
      - epss/epss_enricher.py
  - name: cve-priority-notify-script
    files:
      - epss/cve_priority_notify.py

resources:
  # MITRE ATT&CK
  - mitre/mitre-collector-cronjob.yaml
  - mitre/mitre-normalizer-cronjob.yaml
  # EOL Watch
  - eol-watch/eol-watch-cronjob.yaml
  - eol-watch/lifecycle-notify-cronjob.yaml
  # Mirror Check
  - mirror-check/mirror-check-cronjob.yaml
  # Inventory Scan
  - inventory-scan/inventory-scan-rbac.yaml
  - inventory-scan/inventory-scan-cronjob.yaml
  # CVE Watch
  - cve-watch/cve-watch-cronjob.yaml
  - cve-watch/cve-coverage-report-cronjob.yaml
  # KEV
  - kev/kev-collector-cronjob.yaml
  - kev/kev-notify-cronjob.yaml
  - kev/cve-kev-alert-cronjob.yaml
  # EPSS
  - epss/epss-enricher-cronjob.yaml
  - epss/cve-priority-notify-cronjob.yaml
