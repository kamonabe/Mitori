apiVersion: batch/v1
kind: CronJob
metadata:
  name: kev-notify
  namespace: app
spec:
  schedule: "30 2 * * *"  # 毎日 02:30 UTC (collector の後)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      completions: 1
      parallelism: 1
      backoffLimit: 1
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-secret
          containers:
          - name: kev-notify
            image: ghcr.io/kamonabe/mitre-python:1.0.0
            imagePullPolicy: IfNotPresent
            command:
              - python
              - /app/kev_notify.py
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: KEV_BULK_THRESHOLD
              value: "50"
            - name: NOTIFY_MAX_ITEMS
              value: "5"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: database
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: cve-watch-slack
                  key: webhook-url
                  optional: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - name: script
              mountPath: /app
            - name: common
              mountPath: /common
          volumes:
          - name: script
            configMap:
              name: kev-notify-script
          - name: common
            configMap:
              name: common-lib
          restartPolicy: Never
