apiVersion: batch/v1
kind: CronJob
metadata:
  name: kev-collector
  namespace: app
spec:
  schedule: "0 2 * * *"  # 毎日 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      completions: 1
      parallelism: 1
      backoffLimit: 1
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-secret
          containers:
          - name: kev-collector
            image: ghcr.io/kamonabe/mitre-python:1.0.0
            imagePullPolicy: IfNotPresent
            command:
              - python
              - /app/kev_collector.py
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: cve-watch-db
                  key: database
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            volumeMounts:
            - name: script
              mountPath: /app
            - name: common
              mountPath: /common
          volumes:
          - name: script
            configMap:
              name: kev-collector-script
          - name: common
            configMap:
              name: common-lib
          restartPolicy: Never
