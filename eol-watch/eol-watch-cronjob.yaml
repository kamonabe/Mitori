apiVersion: batch/v1
kind: CronJob
metadata:
  name: eol-watch
  namespace: app
spec:
  schedule: "0 6 * * *"    # 毎日 06:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completions: 2
      parallelism: 2
      backoffLimit: 1
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-secret
          containers:
          - name: collector
            image: ghcr.io/kamonabe/mitre-python:1.0.0
            imagePullPolicy: IfNotPresent
            command:
              - python
              - /app/collector.py
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: eol-watch-db
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: eol-watch-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eol-watch-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: eol-watch-db
                  key: database
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: eol-watch-slack
                  key: webhook-url
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi
            volumeMounts:
            - name: script
              mountPath: /app
            - name: common
              mountPath: /common
          volumes:
          - name: script
            configMap:
              name: eol-watch-script
          - name: common
            configMap:
              name: common-lib
          restartPolicy: Never
