name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "mitre/Dockerfile"
      - "inventory-scan/Dockerfile"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  # main への push（Dockerfile 変更時）は変更のあったイメージだけをビルドする。
  # タグ push（リリース）は両イメージをまとめて発行したいので、このジョブの結果は無視される。
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      mitre: ${{ steps.filter.outputs.mitre }}
      inventory: ${{ steps.filter.outputs.inventory }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mitre:
              - 'mitre/Dockerfile'
            inventory:
              - 'inventory-scan/Dockerfile'

  build-mitre-python:
    needs: detect-changes
    # タグ push 時は常にビルド。main push 時は mitre/Dockerfile が変わったときだけ。
    if: startsWith(github.ref, 'refs/tags/v') || needs.detect-changes.outputs.mitre == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kamonabe/mitre-python
          # :latest は conventions で禁止のため自動付与を無効化する。
          flavor: |
            latest=false
          # タグ push (v1.0.1) -> 固定タグ 1.0.1 を発行。
          # main push -> コミット SHA タグを発行（追跡用。マニフェストは参照しない）。
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: mitre
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-inventory-scan:
    needs: detect-changes
    if: startsWith(github.ref, 'refs/tags/v') || needs.detect-changes.outputs.inventory == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kamonabe/inventory-scan
          # :latest は conventions で禁止のため自動付与を無効化する。
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: inventory-scan
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
