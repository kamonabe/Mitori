name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "mitre/Dockerfile"
      - "inventory-scan/Dockerfile"

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      mitre: ${{ steps.filter.outputs.mitre }}
      inventory: ${{ steps.filter.outputs.inventory }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mitre:
              - 'mitre/Dockerfile'
            inventory:
              - 'inventory-scan/Dockerfile'

  build-mitre-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.mitre == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: mitre
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/kamonabe/mitre-python:${{ github.sha }}
            ghcr.io/kamonabe/mitre-python:latest

  build-inventory-scan:
    needs: detect-changes
    if: needs.detect-changes.outputs.inventory == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: inventory-scan
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/kamonabe/inventory-scan:${{ github.sha }}
            ghcr.io/kamonabe/inventory-scan:latest
